version: '3.8'

services:
  bs9:
    build:
      context: .
      dockerfile: src/docker/Dockerfile
    container_name: bs9-manager
    hostname: bs9
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bs9_data:/app/.config/bs9
      - ./examples:/app/examples:ro
    ports:
      - "127.0.0.1:8080:8080"  # Web dashboard bound to loopback
      - "3000-3010:3000-3010"  # Application ports
    environment:
      - NODE_ENV=production
      - WEB_DASHBOARD_PORT=8080
      - WEB_DASHBOARD_HOST=127.0.0.1
    command: ["bun", "run", "bin/bs9", "web", "--port", "8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bs9-prometheus
    ports:
      - "127.0.0.1:9090:9090"  # Bound to loopback
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: bs9-grafana
    ports:
      - "127.0.0.1:3001:3000"  # Bound to loopback, not public network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

volumes:
  bs9_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: bs9-network
