name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bun-version: ["1.4.1", latest]
    env:
      BS9_WINDOWS_BACKGROUND: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ matrix.bun-version }}
        
    - name: Install dependencies
      run: bun install
      
    - name: Run tests
      run: bun test

  native-lifecycle:
    name: Native lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      BS9_NATIVE_E2E: "1"
      BS9_HOME: ${{ github.workspace }}/.tmp-bs9-native-e2e
      BS9_WINDOWS_BACKGROUND: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run native lifecycle test
      run: bun test tests/e2e-native-platform-lifecycle.test.ts

    - name: Clean up native test services
      if: always()
      run: bun scripts/cleanup-native-e2e.ts
      


  native-ha-load:
    name: Native HA load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BS9_NATIVE_HA_E2E: "1"
      BS9_HOME: ${{ github.workspace }}/.tmp-bs9-native-ha
      BS9_WINDOWS_BACKGROUND: "1"
      BS9_HA_CONCURRENCY: ${{ github.event_name == 'schedule' && '50' || '20' }}
      BS9_HA_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '300' || '5' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run native HA load and chaos gate
      run: bun test tests/e2e-native-ha-load.test.ts

    - name: Upload HA reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-ha-${{ matrix.os }}
        path: test-results/native-ha/
        if-no-files-found: warn

    - name: Clean up native HA services
      if: always()
      run: bun scripts/cleanup-native-e2e.ts

  release-gate:
    name: Cross-platform release gate
    runs-on: ubuntu-latest
    needs: [test, native-lifecycle, native-ha-load]
    steps:
    - name: Confirm all validation layers passed
      run: echo "All Linux, macOS, and Windows validation gates passed."

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: release-gate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Build application
      run: bun run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/







  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Generate documentation
      run: |
        # Generate API documentation
        echo "API documentation generated"
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        enable_jekyll: true
