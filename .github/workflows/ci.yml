name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      ha_soak:
        description: Native HA load duration
        required: true
        type: choice
        options:
          - quick
          - extended
        default: quick

jobs:
  test:
    name: Full suite (${{ matrix.os }}, bun-${{ matrix.bun-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bun-version: ["1.4.1", latest]
    env:
      BS9_WINDOWS_BACKGROUND: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ matrix.bun-version }}
        
    - name: Install dependencies
      run: bun install
      
    - name: Run tests
      run: bun test --timeout 20000

  native-lifecycle:
    name: Native lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      BS9_NATIVE_E2E: "1"
      BS9_HOME: ${{ github.workspace }}/.tmp-bs9-native-e2e
      BS9_WINDOWS_BACKGROUND: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run native lifecycle test
      run: bun test tests/e2e-native-platform-lifecycle.test.ts

    - name: Clean up native test services
      if: always()
      run: bun scripts/cleanup-native-e2e.ts
      


  native-ha-load:
    name: Native HA load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BS9_NATIVE_HA_E2E: "1"
      BS9_HOME: ${{ github.workspace }}/.tmp-bs9-native-ha
      BS9_WINDOWS_BACKGROUND: "1"
      BS9_HA_CONCURRENCY: ${{ (github.event_name == 'schedule' || inputs.ha_soak == 'extended') && '50' || '20' }}
      BS9_HA_SOAK_SECONDS: ${{ (github.event_name == 'schedule' || inputs.ha_soak == 'extended') && '300' || '5' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run native HA load and chaos gate
      run: bun test tests/e2e-native-ha-load.test.ts

    - name: Upload HA reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-ha-${{ matrix.os }}
        path: test-results/native-ha/
        if-no-files-found: warn

    - name: Clean up native HA services
      if: always()
      run: bun scripts/cleanup-native-e2e.ts

  packaged-qualification:
    name: Packaged production qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025, macos-14, macos-15, macos-26]
    env:
      BS9_WINDOWS_BACKGROUND: "1"
      BS9_HA_CONCURRENCY: "25"
      BS9_HA_SOAK_SECONDS: "10"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Pack, install, and qualify the npm artifact
      run: bun run test:package

    - name: Upload packaged qualification reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: packaged-qualification-${{ matrix.os }}
        path: test-results/native-ha/
        if-no-files-found: warn

    - name: Clean up native qualification services
      if: always()
      run: bun scripts/cleanup-native-e2e.ts

  linux-distro-compatibility:
    name: Linux distro (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl unzip ca-certificates git
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl unzip ca-certificates git
          - name: Debian 12
            image: debian:12
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl unzip ca-certificates git
          - name: Debian 13
            image: debian:13
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl unzip ca-certificates git
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9
            prepare: dnf install -y bash unzip ca-certificates git findutils
          - name: Red Hat UBI 9
            image: registry.access.redhat.com/ubi9/ubi:latest
            prepare: dnf install -y bash unzip ca-certificates git findutils
          - name: Rocky Linux 9
            image: rockylinux:9
            prepare: dnf install -y bash unzip ca-certificates git findutils
          - name: AlmaLinux 9
            image: almalinux:9
            prepare: dnf install -y bash unzip ca-certificates git findutils
          - name: Fedora
            image: fedora:latest
            prepare: dnf install -y bash curl unzip ca-certificates git findutils
          - name: openSUSE Leap 15.6
            image: opensuse/leap:15.6
            prepare: zypper --non-interactive install bash curl unzip ca-certificates git findutils
          - name: Arch Linux
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm bash curl unzip ca-certificates git findutils
          - name: Alpine Linux 3.21
            image: alpine:3.21
            prepare: apk add --no-cache bash curl unzip ca-certificates git findutils libstdc++
          - name: Linux Mint 21.3
            image: linuxmintd/mint21.3-amd64:latest
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl unzip ca-certificates git
    env:
      DISTRO_IMAGE: ${{ matrix.image }}
      DISTRO_PREPARE: ${{ matrix.prepare }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run qualification inside distribution image
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/src:ro" \
          "$DISTRO_IMAGE" \
          sh -lc "$DISTRO_PREPARE && cp -R /src /work && cd /work && bash scripts/linux-distro-qualification.sh"

  release-gate:
    name: Cross-platform release gate
    runs-on: ubuntu-latest
    needs: [test, native-lifecycle, native-ha-load, packaged-qualification, linux-distro-compatibility]
    steps:
    - name: Confirm all validation layers passed
      run: echo "All Linux, macOS, and Windows validation gates passed."

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: release-gate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Build application
      run: bun run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/







  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Generate documentation
      run: |
        # Generate API documentation
        echo "API documentation generated"
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        enable_jekyll: true
